[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["custom_components/alerts_energy_outages"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
follow_imports = "skip"

[tool.coverage.run]
source = ["custom_components/alerts_energy_outages"]

[tool.coverage.report]
show_missing = true
