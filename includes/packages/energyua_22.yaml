rest:
- resource: https://alerts.energy/api/v1/source-registry/areas/kyiv/shutdowns
  scan_interval: 60
  timeout: 30
  headers:
    Referer: https://alerts.energy/kyiv
    User-Agent: Mozilla/5.0 (Home Assistant; alerts.energy schedule)
    Accept: application/json
  sensor:
  - name: energyua_22_today_hours
    unique_id: energyua_22_today_hours
    value_template: |-
      {% set rows = value_json | selectattr('initiator', 'eq', 'kyiv_oblenergo') | selectattr('queue', 'eq', '2.2') | list %}
      {% set row = rows[0] if rows else {} %}
      {% set hours = row.get('today') %}
      {% set ns = namespace(valid=hours is sequence and hours is not string and hours is not mapping and hours | count == 24) %}
      {% if ns.valid %}
        {% for v in hours %}{% if v is not integer or v not in [0,1,2,3] %}{% set ns.valid = false %}{% endif %}{% endfor %}
      {% endif %}
      {% if ns.valid and row.get('todayDate') == now().date().isoformat() and row.get('todayStatus') == 'ScheduleApplies' %}{{ hours | to_json }}{% else %}unknown{% endif %}
    json_attributes_path: $[?(@.initiator=='kyiv_oblenergo' and @.queue=='2.2')]
    json_attributes:
    - todayDate
    - todayStatus
  - name: energyua_22_tomorrow_hours
    unique_id: energyua_22_tomorrow_hours
    value_template: |-
      {% set rows = value_json | selectattr('initiator', 'eq', 'kyiv_oblenergo') | selectattr('queue', 'eq', '2.2') | list %}
      {% set row = rows[0] if rows else {} %}
      {% set hours = row.get('tomorrow') %}
      {% set ns = namespace(valid=hours is sequence and hours is not string and hours is not mapping and hours | count == 24) %}
      {% if ns.valid %}
        {% for v in hours %}{% if v is not integer or v not in [0,1,2,3] %}{% set ns.valid = false %}{% endif %}{% endfor %}
      {% endif %}
      {% if ns.valid and row.get('tomorrowDate') == (now().date() + timedelta(days=1)).isoformat() and row.get('tomorrowStatus') == 'ScheduleApplies' %}{{ hours | to_json }}{% else %}unknown{% endif %}
    json_attributes_path: $[?(@.initiator=='kyiv_oblenergo' and @.queue=='2.2')]
    json_attributes:
    - tomorrowDate
    - tomorrowStatus
