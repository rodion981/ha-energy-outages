- sensor:
  - name: energyua_22_today_slot1_start_text
    unique_id: energyua_22_today_slot1_start_text
    state: |-
      {% set hours = (states('sensor.energyua_22_today_hours') | from_json if (has_value('sensor.energyua_22_today_hours') and state_attr('sensor.energyua_22_today_hours', 'todayDate') == now().date().isoformat() and state_attr('sensor.energyua_22_today_hours', 'todayStatus') == 'ScheduleApplies') else []) %} {% set ns = namespace(bits=[], periods=[], start=none) %} {% for v in hours %}{% set ns.bits = ns.bits + [v in [1,2], v in [1,3]] %}{% endfor %} {% for on in ns.bits %}
        {% if on and ns.start is none %}{% set ns.start = loop.index0 %}
        {% elif not on and ns.start is not none %}{% set ns.periods = ns.periods + [[ns.start, loop.index0]] %}{% set ns.start = none %}{% endif %}
      {% endfor %} {% if ns.start is not none %}{% set ns.periods = ns.periods + [[ns.start, 48]] %}{% endif %} {% if ns.periods | length > 0 %}{{ '%02d:%02d' | format(ns.periods[0][0] // 2, (ns.periods[0][0] % 2) * 30) }}{% endif %}
    availability: '{{ (states(''sensor.energyua_22_today_hours'') | from_json if (has_value(''sensor.energyua_22_today_hours'')
