      {% set ns = namespace(bits=[], periods=[], start=none, result=[]) %}
      {% for v in hours %}{% set ns.bits = ns.bits + [v in [1,2], v in [1,3]] %}{% endfor %}
      {% for on in ns.bits %}
        {% if on and ns.start is none %}{% set ns.start = loop.index0 %}
        {% elif not on and ns.start is not none %}
          {% set ns.periods = ns.periods + [[ns.start, loop.index0]] %}{% set ns.start = none %}
        {% endif %}
      {% endfor %}
      {% if ns.start is not none %}{% set ns.periods = ns.periods + [[ns.start, 48]] %}{% endif %}
      {% for start,end in ns.periods %}
        {% set ns.result = ns.result + ['%02d:%02d–%02d:%02d' | format(start // 2, start % 2 * 30, end // 2, end % 2 * 30)] %}
      {% endfor %}
      {% set text = ns.result | join('; ') %}
      {% if hours | count != 24 %}Даних на сьогодні немає
      {% elif not ns.result %}Без відключень
      {% elif text | length <= 255 %}{{ text }}
      {% else %}{{ ns.result[:18] | join('; ') }}; … (+{{ ns.result | count - 18 }}){% endif %}
    attributes:
      periods: |-
        {% set hours = (states('sensor.energyua_22_today_hours') | from_json if (has_value('sensor.energyua_22_today_hours') and state_attr('sensor.energyua_22_today_hours', 'todayDate') == now().date().isoformat() and state_attr('sensor.energyua_22_today_hours', 'todayStatus') == 'ScheduleApplies') else []) %}
